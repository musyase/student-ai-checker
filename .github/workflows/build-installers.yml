name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
          - os: macos-latest
            artifact: macos-dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[desktop]"

      - name: Build backend sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\packaging\build_backend.ps1

      - name: Smoke-test backend sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\src-tauri\binaries\student-ai-checker-backend-x86_64-pc-windows-msvc.exe batch --help

      - name: Install Python dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[desktop]'

      - name: Build backend sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: bash packaging/build_backend.sh

      - name: Smoke-test backend sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          target="$(rustc --print host-tuple)"
          "./src-tauri/binaries/student-ai-checker-backend-$target" batch --help

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri:build -- --bundles nsis

      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: npm run tauri:build -- --bundles dmg

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload macOS disk image
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --verify-tag
